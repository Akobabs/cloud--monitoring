[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-anomaly-research"
version = "1.0.0"
description = "Reproducible offline comparison of four cloud anomaly detectors"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

